[project]
name = "ffdash"
version = "0.1.0"
description = "NFL fantasy start/sit dashboard. One page per game."
requires-python = ">=3.11"
dependencies = [
    "nflreadpy>=0.1.0",
    "polars>=1.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "tzdata>=2026.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ffdash"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
